<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Card</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f2f2f2;
}

.card{
    width:320px;
    background:white;
    margin:60px auto;
    padding:20px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 0 15px rgba(0,0,0,0.2);
}

img{
    width:120px;
    height:120px;
    border-radius:50%;
}

h2{
    margin:10px 0;
}

p{
    color:gray;
}

button{
    background:#007BFF;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:5px;
    cursor:pointer;
}
</style>

</head>
<body>

<div class="card">

<img src="https://via.placeholder.com/120" alt="Profile">

<h2>Mazhar Khan</h2>

<h3>Web Development Student</h3>

<p>
Learning HTML, CSS, JavaScript and Python.<br>
I Love Creating beautifull Website.
</p>

<button>View Portfolio</button>

</div>

</body>
</html>
