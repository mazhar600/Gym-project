<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <input type="number" id="v1" placeholder="obtained marks">
    <input type="number" id="v2" oninput="checkpercentage()" placeholder="total marks">
    <input type="text" id="v3" placeholder="result">

  <script>  

function checkpercentage()
{
   let obt=document.getElementById('v1').value;
    let total=document.getElementById('v2').value;
    let perc=(obt/total)*100;
    // alert(perc);
    if(perc>=0 && perc<50)
{
    document.getElementById('v3').value="Not Eligible"
    document.getElementById('v3').style.backgroundColor ="red";

}
 else if(perc>=50 && perc<=100)
{
    document.getElementById('v3').value="Eligible"
     document.getElementById('v3').style.backgroundColor ="green";

}

else
{
    document.getElementById('v3').value="Invalid Input";
     document.getElementById('v3').style.backgroundColor ="blue";

}
}


  </script>
</body>
</html>
