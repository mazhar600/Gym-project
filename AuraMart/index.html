<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraMart - Online Shopping Store</title>
    <!-- Tailwind CSS CDN for quick styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- Header / Navbar -->
    <header class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-indigo-600">AuraMart</h1>
            <nav class="space-x-6 hidden md:block">
                <a href="#" class="hover:text-indigo-600 font-medium">Home</a>
                <a href="#products" class="hover:text-indigo-600 font-medium">Products</a>
                <a href="#contact" class="hover:text-indigo-600 font-medium">Contact</a>
            </nav>
            <div class="flex items-center space-x-4">
                <button id="cart-btn" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition">
                    Cart (<span id="cart-count">0</span>)
                </button>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="bg-indigo-900 text-white py-20 text-center">
        <div class="max-w-3xl mx-auto px-4">
            <h2 class="text-4xl md:text-5xl font-extxl mb-4">Discover Your Style with AuraMart</h2>
            <p class="text-lg text-indigo-200 mb-6">Shop the best products with amazing deals and fast delivery.</p>
            <a href="#products" class="bg-white text-indigo-900 font-semibold px-6 py-3 rounded-lg shadow hover:bg-gray-100 transition">Shop Now</a>
        </div>
    </section>

    <!-- Products Section with Search Bar -->
    <main id="products" class="max-w-7xl mx-auto px-4 py-12">
        <h3 class="text-2xl font-bold mb-4 text-center">Featured Products</h3>
        
        <!-- Search Bar -->
        <div class="max-w-md mx-auto mb-8">
            <input type="text" id="search-input" placeholder="Search products..." onkeyup="searchProducts()" class="w-full px-4 py-2 border rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-600">
        </div>

        <!-- Products Grid Container -->
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- JavaScript yahan products dynamically load karega -->
        </div>
    </main>
<!-- Contact Section -->
    <section id="contact" class="max-w-4xl mx-auto px-4 py-16">
        <h3 class="text-2xl font-bold mb-6 text-center">Contact Us</h3>
        <form onsubmit="handleContact(event)" class="bg-white p-8 rounded-xl shadow space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Your Name</label>
                <input type="text" id="contact-name" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-600" placeholder="Enter your name">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Your Email</label>
                <input type="email" id="contact-email" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-600" placeholder="Enter your email">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Message</label>
                <textarea id="contact-message" rows="4" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-600" placeholder="Write your message here..."></textarea>
            </div>
            <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-lg hover:bg-indigo-700 transition font-semibold">
                Send Message
            </button>
        </form>
    </section>
    <!-- Cart Modal / Sidebar -->
    <div id="cart-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-end z-50">
        <div class="bg-white w-96 h-full p-6 flex flex-col justify-between shadow-lg">
            <div>
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-xl font-bold">Your Cart</h3>
                    <button onclick="toggleCart()" class="text-gray-500 hover:text-black font-bold text-lg">✕</button>
                </div>
                <!-- Cart Items List -->
                <div id="cart-items" class="space-y-4 overflow-y-auto max-h-[70vh]">
                    <p class="text-gray-500">Your cart is empty.</p>
                </div>
            </div>
            <!-- Total and Checkout -->
            <div class="border-t pt-4">
                <div class="flex justify-between mb-4 font-bold text-lg">
                    <span>Total:</span>
                    <span id="cart-total">$0.00</span>
                </div>
                <button onclick="checkout()" class="w-full bg-green-600 text-white py-3 rounded-lg hover:bg-green-700 transition font-semibold">
                    Checkout
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
